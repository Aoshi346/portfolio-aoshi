<!doctype html>
<html lang="es" data-theme="caelestia">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aoshi Blanco Sanz — Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Aoshi Blanco Sanz, desarrollador full stack (Python, React, Django, TypeScript). Estudiante de Ingeniería de Sistemas. Portfolio con casos de estudio reales."
    />
    <meta property="og:title" content="Aoshi Blanco Sanz — Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="Python, React, Django y TypeScript aplicados a productos reales. Casos de estudio, stack y contacto."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="theme-color" content="#f8f8f8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      La hoja de fuentes se pide AQUI, con un script inline, y no desde el
      bundle: pedirla desde `applyTheme` (themes/index.ts) obliga a esperar a
      que se descargue, se parsee y se ejecute ese modulo antes de que arranque
      siquiera la peticion del CSS de Google Fonts, que a su vez dispara la del
      .woff2. El titular del hero es el elemento LCP y depende de esa fuente.
      Insertada por script, ademas, no bloquea el primer pintado.

      Esta URL y el `fontHref` de src/themes/caelestia.ts van SIEMPRE a la par:
      `loadThemeFonts` no vuelve a pedir la que ya esta puesta, asi que una
      desincronizacion degrada a la via lenta en silencio.
    -->
    <script>
      (function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href =
          "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Hanken+Grotesk:wght@100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap";
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
