    <!--
      El tema se sortea aqui, antes del primer pintado, para que no haya flash
      (Caelestia es claro y los otros dos oscuros). src/themes/index.ts respeta
      este valor. La lista de ids se duplica a proposito: es el precio de
      evitar el FOUC sin cargar el bundle antes de pintar.
    -->
    <script>
      (function () {
        var ids = ["vice", "hyprland", "caelestia"];
        var forced = new URLSearchParams(location.search).get("theme");
        var id = ids.indexOf(forced) >= 0 ? forced : ids[Math.floor(Math.random() * ids.length)];
        document.documentElement.dataset.theme = id;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
