<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aoshi Blanco Sanz — Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Aoshi Blanco Sanz, desarrollador full stack (Python, React, Django, TypeScript). Estudiante de Ingeniería de Sistemas. Portfolio con casos de estudio reales."
    />
    <meta property="og:title" content="Aoshi Blanco Sanz — Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="Python, React, Django y TypeScript aplicados a productos reales. Casos de estudio, stack y contacto."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="theme-color" content="#05070a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      El tema se sortea aqui, antes del primer pintado, para que no haya flash
      (Caelestia es claro y los otros dos oscuros). src/themes/index.ts respeta
      este valor. La lista de ids se duplica a proposito: es el precio de
      evitar el FOUC sin cargar el bundle antes de pintar.
    -->
    <script>
      (function () {
        var ids = ["vice", "hyprland", "caelestia"];
        var forced = new URLSearchParams(location.search).get("theme");
        var id = ids.indexOf(forced) >= 0 ? forced : ids[Math.floor(Math.random() * ids.length)];
        document.documentElement.dataset.theme = id;

        /*
          La hoja de fuentes se pide AQUI, no desde `applyTheme` (themes/index.ts).
          Pedirla desde el bundle obliga a esperar a que se descargue, se parsee y
          se ejecute ese modulo antes de que arranque siquiera la peticion del CSS
          de Google Fonts, que a su vez dispara la del .woff2: dos saltos
          encadenados detras de una espera evitable. El titular del hero es el
          elemento LCP de la pagina y depende de esa fuente.

          Duplicar las URLs es el mismo precio que ya se paga con la lista de ids
          de arriba. Si se anade o cambia un tema, hay que tocar su `fontHref` en
          themes/*.ts Y este mapa; `loadThemeFonts` no vuelve a pedir la que ya
          este puesta, asi que una desincronizacion degrada a la via lenta, no a
          una peticion duplicada.
        */
        var fontHrefs = {
          vice: "https://fonts.googleapis.com/css2?family=Passion+One:wght@900&family=Manrope:wght@200;300;400;600;700&family=Pathway+Gothic+One&display=swap",
          hyprland:
            "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap",
          caelestia:
            "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Hanken+Grotesk:wght@100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap",
        };
        if (fontHrefs[id]) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = fontHrefs[id];
          document.head.appendChild(link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
